<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b12"><title>ALISH AI</title>
<style>
:root{color-scheme:dark;--bg:#090b12;--panel:#111521;--panel2:#171d2b;--line:#252d40;--text:#f3f5fb;--muted:#9ba6bb;--accent:#7c6cff;--accent2:#29c6d5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#171936 0,#090b12 52%);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100dvh}.app{height:100dvh;display:flex;max-width:1200px;margin:auto;border-inline:1px solid #1b2232}.sidebar{width:270px;background:#0c101a;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:14px}.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:900;color:white}.brand strong{font-size:17px;letter-spacing:.5px}.brand small{display:block;color:var(--muted);font-size:11px}.new{border:1px solid #45406f;background:#211d3e;color:white;border-radius:12px;padding:12px;text-align:left;font-weight:650}.history{overflow:auto;flex:1}.history-label{font-size:11px;color:var(--muted);padding:6px 9px;text-transform:uppercase;letter-spacing:1px}.chat-item{display:flex;align-items:center;gap:6px;padding:9px;border-radius:10px;color:#cbd2e2;cursor:pointer}.chat-item.active,.chat-item:hover{background:var(--panel2)}.chat-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.del{background:none;border:0;color:#7f8aa1;padding:4px;font-size:17px}.side-note{color:var(--muted);font-size:11px;padding:10px}.main{min-width:0;flex:1;display:flex;flex-direction:column}.top{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#0c101acc}.top-title{font-weight:700}.status{font-size:12px;color:#83d9c1}.messages{flex:1;overflow:auto;padding:28px max(18px,calc((100% - 760px)/2));display:flex;flex-direction:column;gap:18px}.welcome{margin:auto;text-align:center;max-width:560px}.orb{width:68px;height:68px;margin:0 auto 18px;border-radius:23px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:28px;box-shadow:0 10px 45px #6157d455}.welcome h1{font-size:30px;margin:0 0 8px}.welcome p{color:var(--muted);margin:0 0 22px}.suggestions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.suggestions button{border:1px solid var(--line);background:var(--panel);color:#dce2f0;border-radius:20px;padding:9px 12px}.msg{max-width:85%;padding:13px 16px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{align-self:flex-end;background:#29234d;border:1px solid #494080}.msg.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}.msg.error{border-color:#7d3945;color:#ffc5cb}.typing{color:var(--muted);font-size:13px;padding:4px 8px}.composer-wrap{padding:12px 18px max(16px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#0b0e17}.composer{max-width:800px;margin:auto;display:flex;gap:9px;align-items:flex-end;background:var(--panel);border:1px solid #303950;border-radius:17px;padding:9px}.composer textarea{resize:none;max-height:150px;min-height:28px;flex:1;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:5px}.send{width:40px;height:40px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--accent),#5549c8);color:white;font-size:18px}.send:disabled{opacity:.45}.hint{text-align:center;color:#7f8aa1;font-size:10px;margin:8px 0 0}.mobile-head{display:none}
@media(max-width:700px){.sidebar{position:fixed;z-index:5;inset:0 auto 0 0;width:min(82vw,290px);transform:translateX(-105%);transition:.2s;box-shadow:20px 0 60px #0008}.sidebar.open{transform:translateX(0)}.mobile-head{display:inline-block;border:0;background:none;color:white;font-size:22px;margin-right:10px}.top{padding:0 13px}.messages{padding:20px 13px}.msg{max-width:92%}.welcome h1{font-size:26px}}
</style></head><body><div class="app">
<aside class="sidebar" id="sidebar"><div class="brand"><div class="logo">A</div><div><strong>ALISH AI</strong><small>Твой AI-помощник</small></div></div><button class="new" id="newChat">＋ Новый чат</button><div class="history"><div class="history-label">История</div><div id="chatList"></div></div><div class="side-note">Чаты сохраняются в памяти этого браузера на устройстве.</div></aside>
<main class="main"><header class="top"><div style="display:flex;align-items:center"><button class="mobile-head" id="menu">☰</button><span class="top-title" id="chatTitle">Новый чат</span></div><span class="status">● ALISH AI</span></header><section class="messages" id="messages"><div class="welcome" id="welcome"><div class="orb">✦</div><h1>Привет! Я ALISH AI</h1><p>Задавай вопросы, проси объяснить сложное или помоги себе придумать что-нибудь новое.</p><div class="suggestions"><button>Объясни простыми словами, что такое ИИ</button><button>Помоги придумать идею</button><button>Расскажи интересный факт</button></div></div></section><div class="composer-wrap"><div class="composer"><textarea id="prompt" rows="1" placeholder="Напиши сообщение..."></textarea><button class="send" id="send" aria-label="Отправить">➤</button></div><div class="hint">ALISH AI может ошибаться. Не отправляй пароли и секретные данные.</div></div></main></div>
<script>
const $=s=>document.querySelector(s);const STORE='alish_ai_chats_v2';let chats=[];let current=null;let busy=false;
try{chats=JSON.parse(localStorage.getItem(STORE)||'[]')}catch{chats=[]}if(!Array.isArray(chats))chats=[];
function save(){localStorage.setItem(STORE,JSON.stringify(chats))}function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function createChat(){const c={id:id(),title:'Новый чат',messages:[],updated:Date.now()};chats.unshift(c);current=c.id;save();render()}
function active(){return chats.find(c=>c.id===current)}
function render(){const c=active();$('#chatTitle').textContent=c?.title||'Новый чат';$('#chatList').innerHTML='';chats.sort((a,b)=>b.updated-a.updated).forEach(x=>{const d=document.createElement('div');d.className='chat-item'+(x.id===current?' active':'');const n=document.createElement('span');n.className='chat-name';n.textContent=x.title; n.onclick=()=>{current=x.id;render();$('#sidebar').classList.remove('open')};const del=document.createElement('button');del.className='del';del.textContent='×';del.title='Удалить чат';del.onclick=e=>{e.stopPropagation();chats=chats.filter(v=>v.id!==x.id);if(current===x.id)current=chats[0]?.id||null;if(!current)createChat();else{save();render()}};d.append(n,del);$('#chatList').append(d)});const box=$('#messages');box.innerHTML='';if(!c||!c.messages.length){const w=document.createElement('div');w.className='welcome';w.id='welcome';w.innerHTML='<div class="orb">✦</div><h1>Привет! Я ALISH AI</h1><p>Задавай вопросы, проси объяснить сложное или помоги себе придумать что-нибудь новое.</p><div class="suggestions"><button>Объясни простыми словами, что такое ИИ</button><button>Помоги придумать идею</button><button>Расскажи интересный факт</button></div>';box.append(w);w.querySelectorAll('button').forEach(b=>b.onclick=()=>{ $('#prompt').value=b.textContent;send()})}else{c.messages.forEach(m=>addBubble(m.role,m.text));box.scrollTop=box.scrollHeight}}
function addBubble(role,text,extra=''){const b=document.createElement('div');b.className='msg '+role+(extra?' '+extra:'');b.textContent=text;$('#messages').append(b);$('#messages').scrollTop=$('#messages').scrollHeight;return b}
async function send(){if(busy)return;const input=$('#prompt');const text=input.value.trim();if(!text)return;if(!current)createChat();const c=active();c.messages.push({role:'user',text});if(c.messages.length===1)c.title=text.slice(0,34)+(text.length>34?'…':'');c.updated=Date.now();input.value='';input.style.height='auto';save();render();busy=true;$('#send').disabled=true;const wait=addBubble('ai','ALISH AI думает…','typing');try{const history=c.messages.slice(-20).map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.text}]}));const response=await fetch('/.netlify/functions/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:history})});let data={};try{data=await response.json()}catch{}if(!response.ok)throw new Error(data.error||'Ошибка сервера ('+response.status+').');const answer=data.text;if(!answer)throw new Error('Модель вернула пустой ответ. Попробуй ещё раз.');wait.remove();c.messages.push({role:'assistant',text:answer});c.updated=Date.now();save();addBubble('ai',answer)}catch(e){wait.remove();addBubble('ai','Не удалось получить ответ: '+e.message,'error')}finally{busy=false;$('#send').disabled=false;render();}}
$('#send').onclick=send;$('#prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('#prompt').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,150)+'px'});$('#newChat').onclick=()=>{createChat();$('#sidebar').classList.remove('open')};$('#menu').onclick=()=>$('#sidebar').classList.toggle('open');if(!current&&chats.length)current=chats[0].id;if(!current)createChat();else render();
</script></body></html>
