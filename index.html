<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090b12">
<title>ALISH AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b12;color:#f4f4f5;font:16px Arial,sans-serif;height:100dvh;display:flex;flex-direction:column}
header{padding:16px;background:#111521;border-bottom:1px solid #252b3b;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:21px;font-weight:bold;color:#9b8cff}
button{background:#7657ee;color:white;border:0;border-radius:12px;padding:11px 15px;font-size:14px;cursor:pointer}
#messages{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.msg{padding:13px 15px;border-radius:16px;max-width:88%;white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere}
.user{background:#5842b8;align-self:flex-end}
.ai{background:#171d2b;align-self:flex-start}
.error{color:#ff8585}
footer{padding:12px;background:#111521;border-top:1px solid #252b3b}
#form{display:flex;gap:8px}
textarea{flex:1;resize:none;background:#202638;color:white;border:1px solid #333c50;border-radius:14px;padding:13px;font:16px Arial;min-height:48px;max-height:130px;outline:none}
#preview{max-width:100px;max-height:100px;border-radius:10px;margin:5px}
.tools{display:flex;gap:8px;margin-bottom:9px;align-items:center}
.tools button{background:#252d40}
#file{display:none}
small{color:#9099ad}
</style>
</head>
<body>
<header>
 <div class="logo">✦ ALISH AI</div>
 <button onclick="clearChat()">Новый чат</button>
</header>

<div id="messages"></div>

<footer>
 <div class="tools">
  <button onclick="document.getElementById('file').click()">📎 Фото</button>
  <button onclick="changeTheme()">🎨 Тема</button>
  <button onclick="clearChat()">🗑 Очистить</button>
  <input id="file" type="file" accept="image/jpeg,image/png,image/webp">
  <small id="status">Готов к общению</small>
 </div>
 <img id="preview" hidden>
 <form id="form">
  <textarea id="input" placeholder="Напиши сообщение..." rows="1"></textarea>
  <button type="submit" id="send">➤</button>
 </form>
</footer>

<script>
const messages=document.getElementById('messages');
const input=document.getElementById('input');
const fileInput=document.getElementById('file');
const preview=document.getElementById('preview');
const statusText=document.getElementById('status');
let chats=JSON.parse(localStorage.getItem('alish_ai_chats_v2')||'[]');
let selectedImage=null;

function save(){localStorage.setItem('alish_ai_chats_v2',JSON.stringify(chats))}
function render(){
 messages.innerHTML='';
 chats.forEach(m=>{
  const div=document.createElement('div');
  div.className='msg '+(m.role==='user'?'user':'ai')+(m.error?' error':'');
  div.textContent=m.text;
  if(m.image){
   const img=document.createElement('img');
   img.src=m.image;img.style.maxWidth='200px';img.style.display='block';img.style.marginTop='8px';img.style.borderRadius='10px';
   div.appendChild(img);
  }
  messages.appendChild(div);
 });
 messages.scrollTop=messages.scrollHeight;
}
function add(role,text,image=null,error=false){
 chats.push({role,text,image,error});save();render();
}
function clearChat(){if(confirm('Очистить переписку?')){chats=[];save();render()}}
function changeTheme(){
 const light=document.body.dataset.light!=='1';
 document.body.dataset.light=light?'1':'0';
 document.body.style.background=light?'#f1f2f7':'#090b12';
 document.body.style.color=light?'#171923':'#f4f4f5';
 messages.querySelectorAll('.ai').forEach(x=>x.style.background=light?'#fff':'#171d2b');
 localStorage.setItem('alish_light',light?'1':'0');
}
if(localStorage.getItem('alish_light')==='1')changeTheme();

fileInput.onchange=()=>{
 const f=fileInput.files[0];if(!f)return;
 if(f.size>4*1024*1024){alert('Фото должно быть меньше 4 МБ');return}
 const reader=new FileReader();
 reader.onload=()=>{selectedImage=reader.result;preview.src=selectedImage;preview.hidden=false};
 reader.readAsDataURL(f);
};

document.getElementById('form').onsubmit=async e=>{
 e.preventDefault();
 const text=input.value.trim();
 if(!text&&!selectedImage)return;
 const image=selectedImage;
 input.value='';selectedImage=null;preview.hidden=true;fileInput.value='';
 add('user',text,image);
 const send=document.getElementById('send');
 send.disabled=true;statusText.textContent='Думаю...';
 const contents=chats.slice(-12).map(m=>({
  role:m.role==='ai'?'model':'user',
  parts:[
   ...(m.text?[{text:m.text}]:[]),
   ...(m.image?[{inlineData:{mimeType:m.image.match(/^data:(image\/[^;]+)/)?.[1]||'image/jpeg',data:m.image.split(',')[1]}}]:[])
  ]
 }));
 try{
  const response=await fetch('/.netlify/functions/chat',{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({contents})
  });
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||'Ошибка сервера '+response.status);
  const answer=data.text||data.reply||data.candidates?.[0]?.content?.parts?.[0]?.text;
  if(!answer)throw new Error('Пустой ответ от AI');
  add('ai',answer);
  statusText.textContent='Готов к общению';
 }catch(err){
  add('ai','Не удалось получить ответ: '+err.message,null,true);
  statusText.textContent='Ошибка';
 }
 send.disabled=false;
};
render();
</script>
</body>
</html>
