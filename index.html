
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101014">
<title>ALISH AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
:root{
 --bg:#101014;--panel:#19191f;--panel2:#22222a;
 --text:#f5f5f7;--muted:#9999a5;--border:#303039;
 --accent:#a8ee32;--user:#282831;
}
body.light{
 --bg:#f5f5f7;--panel:#fff;--panel2:#ececf1;
 --text:#202027;--muted:#777783;--border:#dedee5;
 --accent:#79b900;--user:#e9e9f0;
}
body{
 margin:0;background:var(--bg);color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 height:100dvh;overflow:hidden;
}
button,input,textarea{font:inherit}
button{cursor:pointer;color:var(--text)}
#app{height:100dvh;display:flex}
.sidebar{
 width:280px;background:var(--panel);border-right:1px solid var(--border);
 display:flex;flex-direction:column;padding:14px;flex-shrink:0;
}
.brand{display:flex;align-items:center;gap:10px;padding:10px 4px 20px}
.logo{
 width:40px;height:40px;border-radius:14px;background:var(--accent);
 color:#171717;display:grid;place-items:center;font-weight:900;font-size:23px;
}
.brandname{font-size:20px;font-weight:750}
.newchat{
 border:0;background:var(--panel2);border-radius:14px;padding:13px;
 text-align:left;margin-bottom:12px;
}
.search{
 width:100%;background:var(--bg);border:1px solid var(--border);
 border-radius:12px;padding:11px;color:var(--text);outline:none;
 margin-bottom:12px;
}
.chatlist{overflow-y:auto;flex:1}
.chatitem{
 display:flex;align-items:center;gap:7px;border-radius:12px;
 padding:10px;margin-bottom:4px;
}
.chatitem.active{background:var(--panel2)}
.chatname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.chatitem button{
 border:0;background:transparent;color:var(--muted);
 padding:3px;font-size:18px;
}
.sidebarbottom{border-top:1px solid var(--border);padding-top:10px}
.sidebutton{
 width:100%;border:0;background:transparent;text-align:left;
 padding:12px;border-radius:10px;
}
.sidebutton:hover,.chatitem:hover{background:var(--panel2)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
 height:60px;display:flex;align-items:center;gap:10px;
 padding:0 15px;border-bottom:1px solid var(--border);
}
.menubtn{border:0;background:transparent;font-size:23px;padding:7px}
.topname{font-weight:700;flex:1}
.topbtn{border:1px solid var(--border);background:var(--panel);
 border-radius:12px;padding:9px 12px}
.messages{
 flex:1;overflow-y:auto;padding:22px 16px;scroll-behavior:smooth;
}
.inner{max-width:780px;margin:auto;width:100%}
.welcome{text-align:center;margin:13vh auto 20px}
.welcomeLogo{
 width:66px;height:66px;border-radius:23px;background:var(--accent);
 color:#171717;font-size:37px;font-weight:900;
 display:grid;place-items:center;margin:0 auto 20px;
}
.welcome h1{font-size:28px;margin:0 0 10px}
.welcome p{color:var(--muted)}
.suggestions{
 display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:24px
}
.suggestion{
 background:var(--panel);border:1px solid var(--border);
 border-radius:14px;padding:12px;font-size:14px;
}
.message{display:flex;margin:15px 0;gap:10px}
.message.user{justify-content:flex-end}
.bubble{
 max-width:90%;padding:13px 15px;border-radius:18px;
 line-height:1.55;overflow-wrap:anywhere;
}
.user .bubble{background:var(--user);border-radius:18px 18px 5px 18px}
.model .bubble{background:transparent;padding-left:2px}
.bubble img{max-width:240px;max-height:300px;border-radius:12px;display:block;margin:8px 0}
.bubble pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--panel2);padding:12px;border-radius:10px}
.bubble code{background:var(--panel2);padding:2px 4px;border-radius:4px}
.bubble a{color:var(--accent)}
.typing{color:var(--muted);padding:10px}
.composerwrap{padding:10px 14px 14px}
.composer{max-width:780px;margin:auto;background:var(--panel);
 border:1px solid var(--border);border-radius:22px;padding:10px}
.preview{display:flex;gap:8px;flex-wrap:wrap;padding:4px}
.previewitem{position:relative}
.previewitem img{height:70px;width:70px;object-fit:cover;border-radius:10px}
.previewitem button{
 position:absolute;top:-5px;right:-5px;border:0;border-radius:50%;
 background:#444;color:white;width:22px;height:22px;
}
textarea{
 width:100%;resize:none;border:0;outline:0;background:transparent;
 color:var(--text);padding:9px;font-size:16px;max-height:160px;
}
.composerbottom{display:flex;align-items:center;gap:8px}
.toolbtn{
 border:0;background:var(--panel2);width:40px;height:40px;
 border-radius:13px;font-size:20px;display:grid;place-items:center;
}
.sendbtn{background:var(--accent);color:#171717;font-weight:800}
.sendbtn:disabled{opacity:.4}
.disclaimer{text-align:center;color:var(--muted);font-size:11px;padding-top:8px}
#fileInput{display:none}
.overlay{display:none}

/* Аккаунт и авторизация */
.account-status{
 color:var(--muted);font-size:12px;padding:3px 12px 9px;
 overflow-wrap:anywhere;
}
.auth-modal{
 display:none;position:fixed;inset:0;z-index:20;
 background:#000b;align-items:center;justify-content:center;padding:18px;
}
.auth-modal.show{display:flex}
.auth-box{
 width:100%;max-width:390px;background:var(--panel);
 border:1px solid var(--border);border-radius:20px;padding:22px;
 box-shadow:0 15px 60px #0006;
}
.auth-box h2{margin:0 0 8px}
.auth-sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.auth-input{
 width:100%;padding:13px;margin:7px 0;border-radius:11px;
 border:1px solid var(--border);background:var(--bg);color:var(--text);
 outline:none;
}
.auth-primary{
 width:100%;padding:13px;border:0;border-radius:12px;
 background:var(--accent);color:#171717;font-weight:800;margin-top:10px;
}
.auth-secondary{
 width:100%;padding:11px;border:1px solid var(--border);
 border-radius:12px;background:transparent;margin-top:9px;
}
.auth-message{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.5}
.auth-close{
 float:right;border:0;background:transparent;font-size:22px;color:var(--muted)
}
@media(max-width:700px){
 .sidebar{position:fixed;z-index:5;top:0;bottom:0;left:0;
 transform:translateX(-105%);transition:transform .2s;width:290px}
 .sidebar.open{transform:translateX(0)}
 .overlay.show{display:block;position:fixed;inset:0;background:#0008;z-index:4}
 .topbar{height:54px}
 .messages{padding:14px 12px}
 .welcome{margin-top:10vh}
 .welcome h1{font-size:25px}
 .bubble{max-width:95%}
 .composerwrap{padding:7px 9px 10px}
}
</style>
</head>

<body>
<div id="app">
<div class="overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">
 <div class="brand">
  <div class="logo">A</div>
  <div class="brandname">ALISH AI</div>
 </div>

 <button class="newchat" id="newChat">＋　Новый чат</button>
 <input class="search" id="search" placeholder="Поиск чатов">
 <div class="chatlist" id="chatlist"></div>

 <div class="sidebarbottom">
  <div class="account-status" id="accountStatus">Гостевой режим</div>
  <button class="sidebutton" id="accountBtn">👤　Войти / Регистрация</button>
  <button class="sidebutton" id="themeBtn">🌙　Тема</button>
  <button class="sidebutton" id="clearBtn">🗑　Удалить все чаты</button>
 </div>
</aside>

<main class="main">
 <header class="topbar">
  <button class="menubtn" id="menuBtn">☰</button>
  <div class="topname">ALISH AI</div>
  <button class="topbtn" id="topNew">＋</button>
 </header>

 <section class="messages" id="messages">
  <div class="inner" id="inner"></div>
 </section>

 <div class="composerwrap">
  <div class="composer">
   <div class="preview" id="preview"></div>
   <textarea id="input" rows="1" placeholder="Напиши ALISH AI..."></textarea>
   <div class="composerbottom">
    <button class="toolbtn" id="attach" title="Добавить фото">＋</button>
    <input type="file" id="fileInput" accept="image/*" multiple>
    <div style="flex:1"></div>
    <button class="toolbtn sendbtn" id="send" title="Отправить">↑</button>
   </div>
  </div>
  <div class="disclaimer">ALISH AI может ошибаться. Проверяй важную информацию.</div>
 </div>
</main>
</div>

<div class="auth-modal" id="authModal">
 <div class="auth-box">
  <button class="auth-close" id="authClose">×</button>
  <h2 id="authTitle">Вход в ALISH AI</h2>
  <div class="auth-sub" id="authSubtitle">Войди, чтобы сохранять свои чаты.</div>
  <input class="auth-input" id="authEmail" type="email" placeholder="Электронная почта" autocomplete="email">
  <input class="auth-input" id="authPassword" type="password" placeholder="Пароль" autocomplete="current-password">
  <button class="auth-primary" id="authSubmit">Войти</button>
  <button class="auth-secondary" id="authSwitch">Создать аккаунт</button>
  <button class="auth-secondary" id="authLogout" style="display:none">Выйти из аккаунта</button>
  <div class="auth-message" id="authMessage"></div>
 </div>
</div>

<script>
const SUPABASE_URL = "ВСТАВЬ_SUPABASE_URL";
const SUPABASE_ANON_KEY = "ВСТАВЬ_SUPABASE_PUBLISHABLE_KEY";

const $=id=>document.getElementById(id);
const KEY="alish_ai_chat_sessions_v3";
const OLDKEY="alish_ai_chats_v2";

let supabase=null;
let user=null;
let userRole="user";
let chats=[];
let activeId=null;
let pendingImages=[];
let busy=false;
let authMode="login";
let cloudReady=false;

function uid(){
 return Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}
function uuid(){
 return crypto.randomUUID();
}
function current(){
 return chats.find(c=>c.id===activeId);
}
function saveLocal(){
 try{localStorage.setItem(KEY,JSON.stringify(chats))}
 catch(e){alert("Не хватает памяти для сохранения чатов. Удали старые фото.")}
}
function save(){
 saveLocal();
 const c=current();
 if(user&&cloudReady&&c)saveCloud(c);
}
async function saveCloud(c){
 if(!user||!cloudReady||!c)return;
 try{
  if(!c.cloudId)c.cloudId=uuid();
  const result=await supabase.from("chats").upsert({
   id:c.cloudId,user_id:user.id,title:c.title||"Новый чат",
   messages:c.messages||[],updated_at:new Date().toISOString()
  },{onConflict:"id"});
  if(result.error)throw result.error;
  saveLocal();
 }catch(e){
  console.error("Ошибка сохранения чата:",e);
  showAuthMessage("Не удалось сохранить чат в облаке: "+e.message);
 }
}
async function deleteCloud(c){
 if(!user||!c?.cloudId)return;
 const {error}=await supabase.from("chats").delete().eq("id",c.cloudId);
 if(error)console.error("Ошибка удаления:",error);
}
async function syncAllChats(){
 if(!user)return;
 cloudReady=false;
 const localChats=[...chats];
 const {data,error}=await supabase.from("chats")
  .select("id,title,messages,created_at,updated_at")
  .eq("user_id",user.id).order("updated_at",{ascending:false});
 if(error){alert("Не удалось загрузить чаты: "+error.message);return}
 const cloudChats=(data||[]).map(row=>({
  id:row.id,cloudId:row.id,title:row.title||"Новый чат",
  messages:row.messages||[],created:new Date(row.created_at).getTime()||Date.now()
 }));
 const cloudIds=new Set(cloudChats.map(c=>c.cloudId));
 const localOnly=localChats.filter(c=>!c.cloudId||!cloudIds.has(c.cloudId));
 chats=[...cloudChats,...localOnly];
 activeId=chats[0]?.id||null;
 cloudReady=true;saveLocal();renderAll();
 for(const c of localOnly)await saveCloud(c);
}
function migrate(){
 try{
  const old=JSON.parse(localStorage.getItem(OLDKEY)||"[]");
  if(!Array.isArray(old)||!old.length)return;
  chats=old.map((c,i)=>({
   id:uid()+i,title:c.title||c.name||"Старый чат",
   messages:(c.messages||c.history||[]).map(m=>({
    role:m.role==="model"||m.role==="assistant"?"model":"user",
    parts:m.parts||[{text:m.text||m.content||""}]
   })),created:Date.now()-i
  }));
  saveLocal();
 }catch(e){}
}
function load(){
 try{chats=JSON.parse(localStorage.getItem(KEY)||"[]");if(!Array.isArray(chats))chats=[]}
 catch(e){chats=[]}
 if(!chats.length)migrate();
 activeId=chats[0]?.id||null;
}
function createChat(){
 const c={id:uid(),title:"Новый чат",messages:[],created:Date.now()};
 chats.unshift(c);activeId=c.id;save();renderAll();closeSidebar();$("input").focus();
}
function renderList(){
 const list=$("chatlist");list.innerHTML="";
 const q=$("search").value.toLowerCase();
 chats.filter(c=>(c.title||"").toLowerCase().includes(q)).forEach(c=>{
  const item=document.createElement("div");
  item.className="chatitem"+(c.id===activeId?" active":"");
  const name=document.createElement("div");
  name.className="chatname";name.textContent=c.title;
  name.onclick=()=>{activeId=c.id;renderAll();closeSidebar()};
  const rename=document.createElement("button");
  rename.textContent="✎";rename.title="Переименовать";
  rename.onclick=async()=>{
   const t=prompt("Название чата:",c.title);
   if(t&&t.trim()){c.title=t.trim();saveLocal();if(user&&cloudReady)await saveCloud(c);renderList()}
  };
  const del=document.createElement("button");
  del.textContent="×";del.title="Удалить";
  del.onclick=async()=>{
   if(!confirm("Удалить этот чат?"))return;
   chats=chats.filter(x=>x.id!==c.id);await deleteCloud(c);
   if(activeId===c.id)activeId=chats[0]?.id||null;
   saveLocal();renderAll();
  };
  item.append(name,rename,del);list.appendChild(item);
 });
}
function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function simpleMarkdown(text){
 let s=escapeHTML(text);
 s=s.replace(/```([\s\S]*?)```/g,"<pre>$1</pre>");
 s=s.replace(/`([^`]+)`/g,"<code>$1</code>");
 s=s.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
 s=s.replace(/\*([^*]+)\*/g,"<i>$1</i>");
 return s.replace(/\n/g,"<br>");
}
function renderMessages(){
 const inner=$("inner");inner.innerHTML="";
 const c=current();
 if(!c||!c.messages.length){
  const w=document.createElement("div");w.className="welcome";
  w.innerHTML=`<div class="welcomeLogo">A</div><h1>Чем могу помочь?</h1><p>Я ALISH AI. Напиши вопрос или отправь изображение.</p><div class="suggestions"><button class="suggestion">Объясни сложную тему</button><button class="suggestion">Придумай идею</button><button class="suggestion">Напиши текст</button></div>`;
  inner.appendChild(w);
  w.querySelectorAll(".suggestion").forEach(b=>{b.onclick=()=>{$("input").value=b.textContent;$("input").focus()}});
  return;
 }
 c.messages.forEach(m=>{
  const row=document.createElement("div");
  row.className="message "+(m.role==="user"?"user":"model");
  const bubble=document.createElement("div");bubble.className="bubble";
  (m.parts||[]).forEach(p=>{
   if(p.text){const d=document.createElement("div");d.innerHTML=simpleMarkdown(p.text);bubble.appendChild(d)}
   if(p.inlineData){const img=document.createElement("img");img.src="data:"+p.inlineData.mimeType+";base64,"+p.inlineData.data;bubble.appendChild(img)}
   if(p.image){const img=document.createElement("img");img.src=p.image;bubble.appendChild(img)}
  });
  row.appendChild(bubble);inner.appendChild(row);
 });
 $("messages").scrollTop=$("messages").scrollHeight;
}
function renderAll(){renderList();renderMessages()}

/* ИСПРАВЛЕННОЕ ОТКРЫТИЕ И ЗАКРЫТИЕ ПАНЕЛИ */
function closeSidebar(){
 $("sidebar").classList.remove("open");
 $("overlay").classList.remove("show");
}
function toggleSidebar(){
 const isOpen=$("sidebar").classList.contains("open");
 if(isOpen)closeSidebar();
 else{
  $("sidebar").classList.add("open");
  $("overlay").classList.add("show");
 }
}
$("menuBtn").onclick=toggleSidebar;
$("overlay").onclick=closeSidebar;
$("newChat").onclick=createChat;
$("topNew").onclick=createChat;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSidebar()});

$("search").oninput=renderList;
$("themeBtn").onclick=()=>{
 document.body.classList.toggle("light");
 localStorage.setItem("alish_theme",document.body.classList.contains("light")?"light":"dark");
};
if(localStorage.getItem("alish_theme")==="light")document.body.classList.add("light");

$("clearBtn").onclick=async()=>{
 if(!confirm("Удалить все чаты?"))return;
 if(user){
  const {error}=await supabase.from("chats").delete().eq("user_id",user.id);
  if(error){alert("Не удалось удалить облачные чаты: "+error.message);return}
 }
 chats=[];activeId=null;saveLocal();renderAll();
};
$("attach").onclick=()=>$("fileInput").click();
$("fileInput").onchange=async e=>{
 const files=[...e.target.files];
 for(const file of files){
  if(!file.type.startsWith("image/"))continue;
  if(file.size>5*1024*1024){alert("Фото больше 5 МБ. Выбери фото поменьше.");continue}
  const data=await new Promise(resolve=>{
   const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(file);
  });
  pendingImages.push({data,mime:file.type});
 }
 renderPreview();e.target.value="";
};
function renderPreview(){
 const box=$("preview");box.innerHTML="";
 pendingImages.forEach((im,i)=>{
  const item=document.createElement("div");item.className="previewitem";
  const img=document.createElement("img");img.src=im.data;
  const btn=document.createElement("button");btn.textContent="×";
  btn.onclick=()=>{pendingImages.splice(i,1);renderPreview()};
  item.append(img,btn);box.appendChild(item);
 });
}
function resizeInput(){
 const t=$("input");t.style.height="auto";t.style.height=Math.min(t.scrollHeight,160)+"px";
}
$("input").oninput=resizeInput;
$("input").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}};
function titleFrom(text){return text.trim().slice(0,40)||"Новый чат"}

async function sendMessage(){
 if(busy)return;
 const text=$("input").value.trim();
 if(!text&&!pendingImages.length)return;
 if(!current())createChat();
 const c=current();const parts=[];
 if(text)parts.push({text});
 pendingImages.forEach(im=>parts.push({inlineData:{mimeType:im.mime,data:im.data.split(",")[1]}}));
 c.messages.push({role:"user",parts});
 if(c.messages.length===1)c.title=titleFrom(text||"Изображение");
 const imgs=pendingImages.map(im=>({image:im.data}));
 c.messages[c.messages.length-1].parts=[...(text?[{text}]:[]),...imgs];
 $("input").value="";resizeInput();pendingImages=[];renderPreview();
 saveLocal();renderAll();busy=true;$("send").disabled=true;
 const typing=document.createElement("div");typing.className="typing";typing.id="typing";
 typing.textContent="ALISH AI думает...";$("inner").appendChild(typing);
 $("messages").scrollTop=$("messages").scrollHeight;
 try{
  const contents=c.messages.slice(-12).map(m=>({
   role:m.role,
   parts:(m.parts||[]).map(p=>{
    if(p.text)return {text:p.text};
    if(p.inlineData)return {inlineData:p.inlineData};
    if(p.image)return {inlineData:{mimeType:p.image.split(";")[0].split(":")[1],data:p.image.split(",")[1]}};
    return {text:""};
   })
  }));
  const response=await fetch("/.netlify/functions/chat",{
   method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents})
  });
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||"Ошибка сервера");
  const answer=data.reply||data.text||data.candidates?.[0]?.content?.parts?.[0]?.text||"Не удалось получить ответ.";
  c.messages.push({role:"model",parts:[{text:answer}]});
 }catch(err){
  c.messages.push({role:"model",parts:[{text:"Ошибка: "+err.message+"\nПопробуй отправить сообщение ещё раз."}]});
 }
 busy=false;$("send").disabled=false;saveLocal();
 if(user&&cloudReady)await saveCloud(c);
 renderAll();$("input").focus();
}

/* Авторизация Supabase */
function showAuthMessage(message){$("authMessage").textContent=message||""}
function openAuth(){$("authModal").classList.add("show");showAuthMessage("");updateAuthModal()}
function closeAuth(){$("authModal").classList.remove("show")}
function updateAuthModal(){
 if(user){
  $("authTitle").textContent="Твой аккаунт";
  $("authSubtitle").textContent=user.email||"Ты вошёл в ALISH AI";
  $("authEmail").style.display="none";$("authPassword").style.display="none";
  $("authSubmit").style.display="none";$("authSwitch").style.display="none";
  $("authLogout").style.display="block";
  $("authMessage").textContent=userRole==="admin"?"Роль: администратор":"Роль: пользователь";
 }else{
  $("authTitle").textContent=authMode==="login"?"Вход в ALISH AI":"Регистрация";
  $("authSubtitle").textContent=authMode==="login"?"Войди, чтобы сохранять свои чаты.":"Создай аккаунт для личной истории чатов.";
  $("authEmail").style.display="block";$("authPassword").style.display="block";
  $("authSubmit").style.display="block";$("authSwitch").style.display="block";
  $("authLogout").style.display="none";
  $("authSubmit").textContent=authMode==="login"?"Войти":"Создать аккаунт";
  $("authSwitch").textContent=authMode==="login"?"Создать аккаунт":"У меня уже есть аккаунт";
 }
}
function renderAccount(){
 $("accountStatus").textContent=user?"Вошёл: "+user.email:"Гостевой режим — чаты на этом устройстве";
 $("accountBtn").textContent=user?"👤　Мой аккаунт":"👤　Войти / Регистрация";
}
$("accountBtn").onclick=openAuth;
$("authClose").onclick=closeAuth;
$("authModal").onclick=e=>{if(e.target===$("authModal"))closeAuth()};
$("authSwitch").onclick=()=>{authMode=authMode==="login"?"signup":"login";showAuthMessage("");updateAuthModal()};
$("authSubmit").onclick=async()=>{
 const email=$("authEmail").value.trim();const password=$("authPassword").value;
 if(!email||!password){showAuthMessage("Введи почту и пароль.");return}
 if(password.length<6){showAuthMessage("Пароль должен содержать минимум 6 символов.");return}
 $("authSubmit").disabled=true;showAuthMessage("Подожди...");
 try{
  if(authMode==="signup"){
   const {data,error}=await supabase.auth.signUp({email,password});
   if(error)throw error;
   if(data.session){user=data.user;await afterLogin();showAuthMessage("Аккаунт создан. Ты вошёл!")}
   else{showAuthMessage("Аккаунт создан! Проверь почту и подтверди регистрацию, затем войди.");authMode="login";updateAuthModal()}
  }else{
   const {data,error}=await supabase.auth.signInWithPassword({email,password});
   if(error)throw error;
   user=data.user;await afterLogin();showAuthMessage("Ты успешно вошёл!");
  }
 }catch(e){showAuthMessage("Ошибка: "+e.message)}
 $("authSubmit").disabled=false;
};
async function afterLogin(){
 cloudReady=false;
 const {data:roleData}=await supabase.from("user_roles").select("role").eq("user_id",user.id).maybeSingle();
 userRole=roleData?.role||"user";
 await syncAllChats();renderAccount();updateAuthModal();
}
$("authLogout").onclick=async()=>{
 await supabase.auth.signOut();user=null;userRole="user";cloudReady=false;
 chats=[];activeId=null;localStorage.removeItem(KEY);renderAll();renderAccount();closeAuth();
};
async function initAuth(){
 const {data,error}=await supabase.auth.getSession();
 if(error)console.error(error);
 if(data?.session?.user){user=data.session.user;await afterLogin()}
 else{renderAccount()}
 supabase.auth.onAuthStateChange((event,session)=>{
  if(event==="SIGNED_OUT"){
   user=null;userRole="user";cloudReady=false;chats=[];activeId=null;
   localStorage.removeItem(KEY);renderAll();renderAccount();
  }
 });
}
$("send").onclick=sendMessage;

load();renderAll();

if(SUPABASE_URL.startsWith("https://")&&SUPABASE_ANON_KEY.length>20&&window.supabase){
 supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
 initAuth();
}else{
 renderAccount();
 console.warn("Добавь SUPABASE_URL и SUPABASE_ANON_KEY в index.html");
}
</script>
</body>
</html>
